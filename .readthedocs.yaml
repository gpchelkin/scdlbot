# https://scdlbot.readthedocs.io: the README, changelog and privacy policy (see docs/).
# Read the Docs builds it by itself on every push. Locally:
#   python -m venv /tmp/docs && /tmp/docs/bin/pip install -r docs/requirements.txt && /tmp/docs/bin/sphinx-build -W docs /tmp/docs/html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
