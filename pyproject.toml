[project]
name = "scdlbot"
version = "1.0.0"
description = "Telegram bot for downloading audio (and some videos) from SoundCloud, Bandcamp, YouTube and many more sites"
license = "MIT"
readme = "README.md"
authors = [{ name = "George Pchelkin", email = "george@pchelk.in" }]
requires-python = ">=3.14,<3.16"
keywords = ["scdlbot", "telegram", "bot", "soundcloud", "bandcamp", "youtube", "yt-dlp", "audio", "music", "download"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: System Administrators",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Internet",
  "Operating System :: POSIX",
  "Natural Language :: English",
]
# These constraints go into the published package metadata (PyPI).
dependencies = [
  "python-telegram-bot[webhooks,http2,rate-limiter] (>=22.8,<23)",
  "yt-dlp[default,curl-cffi] (>=2026.7.4)",
  "yt-dlp-ejs (>=0.8.0)",
  "curl-cffi (>=0.16.1,<0.17)",  # for yt-dlp impersonation (Instagram); 0.15 segfaults on Python 3.15
  "aiosqlite (>=0.21)",
  "prometheus-client (>=0.25)",
  "sentry-sdk (>=2.0)",
]

[project.urls]
homepage = "https://github.com/gpchelkin/scdlbot"
repository = "https://github.com/gpchelkin/scdlbot"
issues = "https://github.com/gpchelkin/scdlbot/issues"
changelog = "https://github.com/gpchelkin/scdlbot/releases"

[project.scripts]
scdlbot = "scdlbot.__main__:main"

[tool.poetry]
packages = [{ include = "scdlbot" }]

[tool.poetry.dependencies]
# Locally we track yt-dlp master: sites break often and fixes land there first.
# This only affects the lock file; PyPI metadata uses the [project] constraint above.
yt-dlp = { git = "https://github.com/yt-dlp/yt-dlp.git", branch = "master", extras = ["default", "curl-cffi"] }

[tool.poetry.group.dev.dependencies]
ruff = ">=0.14"
pytest = ">=9.0"
pytest-asyncio = ">=1.2"

[tool.ruff]
line-length = 180
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
  "RUF001", "RUF003",  # emoji and ambiguous unicode in user-facing texts are intended
  "ASYNC109",  # timeouts passed down to subprocess and Telegram calls on purpose
  "ASYNC240",  # tiny Path calls are fine
  "SIM108",  # if/else is often clearer than a long ternary
]
per-file-ignores = { "tests/*" = ["RUF059"] }  # tests unpack the whole fixture tuple

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
