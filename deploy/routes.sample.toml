# scdlbot routes and accounts. Set ROUTES_FILE to this file's path; README: Routes has the rules in the order the bot
# applies them. Apply changes without a restart: systemctl reload scdlbot (a broken file keeps the old ones and alerts
# the owner). `scdlbot fetch --route NAME URL` and `--account NAME` try one.
#
# [[routes]]: the ways out to the internet. No cookies here: a route is anonymous unless an account says otherwise.
#   name            letters, digits, "-", "_", "."; used in metrics, logs and alerts
#   proxy           http://, https://, socks5:// or socks5h:// proxy URL; sites see the proxy's IP
#   source_address  the server's IP address to connect from: "0.0.0.0" = any IPv4 address (IPv4 only),
#                   "::" = IPv6 only, or one exact address assigned to the server. With a proxy, it's the address
#                   that connects to the proxy, and it must be of the proxy's IP version.
#                   Without it the system picks: often IPv6 for sites that have it, IPv4 for the rest.
#
# [[accounts]]: logged-in sessions. An account always goes out through its one route (a session that jumps between
# IPs looks hijacked), and logs in only to the sites it lists:
#   name            as for routes (a name is either a route's or an account's)
#   route           the route it goes out through
#   cookies         a cookies.txt path, a URL to download it from (every COOKIES_REFRESH seconds), or
#                   firefox:PROFILE_DIR[:URL_OF_COOKIES_SQLITE] with the full path of a Firefox profile (with a URL, its
#                   cookies.sqlite is downloaded there: tools/serve_firefox_cookies.py serves it from where Firefox runs)
#   always          sites whose every download through that route is logged in (e.g. YouTube's account)
#   when_needed     sites it logs in to only for downloads they give only to logged-in users (age limits, stories, ...):
#                   such a download goes once more through one of the site's when_needed accounts, and links that
#                   never work anonymously (Instagram stories) go straight to them. The account sees only those.
#
# [sites]: which routes each site's downloads use, as the bot names sites (SoundCloud, Bandcamp, YouTube, Yandex Music,
# TikTok, Instagram, Twitter: SITES in scdlbot/links.py) or the domain of any other site, e.g. "mixcloud.com".
# "default" is for every site not listed; without it, those sites use all routes.

[[routes]]
name = "fin1"
source_address = "0.0.0.0"

[[routes]]
name = "fra1"
proxy = "http://100.64.0.7:8888"         # e.g. tinyproxy on another server, over Tailscale

[[routes]]
name = "fin1-v6"
source_address = "::"

# One Firefox profile, logged in to YouTube and to TikTok
[[accounts]]
name = "firefox"
route = "fra1"
cookies = "firefox:/var/lib/scdlbot/firefox/abcd1234.default-release"
always = ["YouTube"]                     # every YouTube download through fra1
when_needed = ["TikTok"]                 # only TikTok's posts that "may not be comfortable for some audiences"

# An Instagram account bought "with cookies" (tools/instagram_cookies.py makes the file): one account per route.
# [[accounts]]
# name = "ig1"
# route = "fin1"
# cookies = "/etc/scdlbot/instagram/ig1.cookies.txt"
# when_needed = ["Instagram"]

[sites]
YouTube = ["fra1"]                       # its account's route only: keep the session on one IP
Instagram = ["fin1", "fra1", "fin1-v6"]  # one of the few sites that works over IPv6
default = ["fin1", "fra1"]               # SoundCloud, Bandcamp and Twitter have no IPv6 addresses
