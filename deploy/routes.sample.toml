# scdlbot routes: the ways downloads go out to the internet. Set ROUTES_FILE to this file's path.
# Apply changes without a restart: systemctl reload scdlbot (a broken file keeps the old routes and alerts the owner).
#
# Each site takes its routes in turn, and all requests of one download go through the same route.
# If a site blocks a download through one route, it's tried once more through another. A route the site keeps
# blocking (ALERT_* settings) is left out for that site for ROUTE_EXCLUSION seconds, and the owner is told;
# if all routes of a site are left out, all of them are used anyway.
#
# A route has a name (letters, digits, "-", "_", "."; used in metrics, logs and alerts) and any of:
#   proxy           http://, https://, socks5:// or socks5h:// proxy URL; sites see the proxy's IP
#   source_address  the server's IP address to connect from: "0.0.0.0" = any IPv4 address (IPv4 only),
#                   "::" = IPv6 only, or one exact address assigned to the server. With a proxy, it's the address
#                   that connects to the proxy, and it must be of the proxy's IP version.
#                   Without it the system picks: often IPv6 for sites that have it, IPv4 for the rest.
#   cookies         for sites that need a login: a cookies.txt path, a URL to download it from (every COOKIES_REFRESH
#                   seconds), or firefox:PROFILE_DIR[:URL_OF_COOKIES_SQLITE] with the full path of a Firefox profile.
#                   Keep a logged-in account on one route: a session jumping between IPs looks hijacked.
#
# Downloads that a site gives only to logged-in users (Instagram's age-restricted reels, stories, posts it answers with
# "empty media response") can go once more through a route with that site's cookies, listed in [login] below.
# Most downloads stay anonymous that way, so the account sees only a few requests a day.

[[routes]]
name = "fin1"
source_address = "0.0.0.0"

[[routes]]
name = "fra1"
proxy = "http://127.0.0.1:3187"
cookies = "firefox:/var/lib/scdlbot/firefox/abcd1234.default-release"

[[routes]]
name = "fin1-v6"
source_address = "::"

# A route only for logging in to Instagram (in [login], and in no [sites] list):
# [[routes]]
# name = "fin1-login"
# source_address = "0.0.0.0"
# cookies = "/etc/scdlbot/instagram-cookies.txt"   # or firefox:/var/lib/scdlbot/firefox/PROFILE

# Which routes each site may use, as the bot names sites: SoundCloud, Bandcamp, YouTube, Yandex Music, TikTok, Instagram,
# Twitter (see SITES in scdlbot/links.py), or the domain of any other site, e.g. "mixcloud.com".
# "default" is for every site not listed; without it, those sites use all routes.
[sites]
YouTube = ["fra1"]                       # logged in: keep the account on one IP
Instagram = ["fin1", "fra1", "fin1-v6"]  # one of the few sites that works over IPv6
default = ["fin1", "fra1"]               # SoundCloud, Bandcamp and Twitter have no IPv6 addresses

# Routes with a site's cookies, for the downloads that site gives only to logged-in users. Each must have cookies.
# [login]
# Instagram = ["fin1-login"]
